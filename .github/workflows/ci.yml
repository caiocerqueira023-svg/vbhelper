name: CI

on:
  push:
    branches: [ main ]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up JDK 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install SDK packages
        run: sdkmanager "platforms;android-37.0" "build-tools;36.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Make wrapper executable
        run: chmod +x gradlew

      # Required gate: compile, unit tests, and a release build (R8 keep rules
      # are part of the release contract).
      - name: Build and run unit tests
        run: >
          ./gradlew
          :game-save-core:test :companion-protocol:test :pc-save-companion:test
          :hardware-dim:test :hardware:testDebugUnitTest
          :app:testIntegrityCheckUnitTest
          :app:assembleDebug :app:assembleRelease
          --console=plain

      # Required gate: static analysis. The baseline file only contains
      # justified pre-existing warnings; any new error fails the build.
      - name: Lint
        run: ./gradlew :app:lint --console=plain

      # Advisory: coverage report (no threshold yet; see docs/performance/BASELINE.md).
      - name: Coverage report (advisory)
        run: >
          ./gradlew :app:jacocoTestReport :game-save-core:jacocoTestReport
          --console=plain
        continue-on-error: true

      # NOTE: detekt/ktlint are deferred until the formatter/analyzer rollout
      # described in docs/refactor/PHASE7_DECISIONS.md; they are not part of the
      # build yet, so CI does not invoke them.
